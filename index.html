                    { text: "A isenção total e perpétua de qualquer lei penal brasileira, sujeitando-os apenas a tribunais internacionais.", isCorrect: false },
                    { text: "O direito de venderem as terras demarcadas para mineradoras multinacionais estrangeiras sem interferência do Estado.", isCorrect: false }
                ]
            },

            // ================= GEOGRAFIA =================
            {
                discipline: "Geografia",
                text: "Um mapa tem escala gráfica em que um segmento de reta de 1 cm equivale a 50 km no terreno real. Se a distância em linha reta entre duas capitais nesse mapa é de 12 cm, essa distância real expressa em <strong>metros</strong> será de:",
                options: [
                    { text: "6.000 metros.", isCorrect: false },
                    { text: "60.000 metros.", isCorrect: false },
                    { text: "600.000 metros.", isCorrect: true }, // 12 * 50 = 600 km -> 600.000 m
                    { text: "6.000.000 metros.", isCorrect: false },
                    { text: "60.000.000 metros.", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "O processo de <strong>desconcentração industrial</strong> no Brasil, ocorrido de forma mais intensa a partir da década de 1990, caracterizou-se por:",
                options: [
                    { text: "Transferência das indústrias das cidades médias e pequenas do Nordeste para as grandes capitais do Sudeste.", isCorrect: false },
                    { text: "Fuga de indústrias tradicionais da Região Metropolitana de São Paulo para o interior paulista, outras regiões brasileiras e até outros países, em busca de menores custos (Guerra Fiscal).", isCorrect: true },
                    { text: "Foco absoluto de novas indústrias na região Norte, visando exclusivamente a preservação sustentável da Floresta Amazônica.", isCorrect: false },
                    { text: "Estatização massiva das indústrias de bens de consumo, concentrando-as todas sob controle do governo em Brasília.", isCorrect: false },
                    { text: "Fim da atividade agropecuária no Centro-Oeste, substituída integralmente pela indústria automobilística.", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "O Cerrado é conhecido como a 'caixa d'água do Brasil' por abrigar as nascentes de importantes bacias hidrográficas. No entanto, é um dos biomas mais ameaçados do país devido principalmente:",
                options: [
                    { text: "Ao avanço do extrativismo mineral artesanal e garimpo costeiro.", isCorrect: false },
                    { text: "Ao intenso desmatamento causado pelo aquecimento global natural.", isCorrect: false },
                    { text: "À expansão da fronteira agrícola, voltada sobretudo para a monocultura de soja e formação de pastagens.", isCorrect: true },
                    { text: "À intensa urbanização verticalizada que criou as maiores megalópoles do país no centro de Goiás.", isCorrect: false },
                    { text: "À plantação em larga escala de seringueiras para extração de látex, típica da região.", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "A chamada <strong>Transição Demográfica</strong> brasileira indica mudanças significativas no perfil da nossa população nas últimas décadas. A fase atual dessa transição no Brasil evidencia:",
                options: [
                    { text: "Altas taxas de natalidade e mortalidade, resultando num crescimento populacional acelerado (explosão demográfica).", isCorrect: false },
                    { text: "Queda na taxa de mortalidade acompanhada de um aumento expressivo na taxa de fecundidade feminina nas capitais.", isCorrect: false },
                    { text: "Uma expressiva redução das taxas de natalidade e aumento da expectativa de vida, ocasionando o envelhecimento populacional.", isCorrect: true },
                    { text: "Uma estabilização demográfica forçada pelo governo através de leis de restrição do número de filhos, similar ao caso chinês.", isCorrect: false },
                    { text: "O aumento acentuado da mortalidade infantil no Sul do Brasil, reduzindo a média de idade do país.", isCorrect: false }
                ]
            }
        ];

        const disciplineOrder = ["Língua Portuguesa", "Matemática", "Ciências", "História", "Geografia"];

        // Função para embaralhar um array
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        let orderedAndShuffledQuestions = [];

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = ""; 
            orderedAndShuffledQuestions = []; 

            let globalQuestionIndex = 1;

            disciplineOrder.forEach(disciplineName => {
                let questionsOfDiscipline = questionsData.filter(q => q.discipline === disciplineName);
                
                // Embaralha as questões APENAS dentro de sua disciplina
                questionsOfDiscipline = shuffleArray(questionsOfDiscipline);

                if(questionsOfDiscipline.length > 0) {
                    let sectionTitle = document.createElement('h2');
                    sectionTitle.className = 'discipline-section';
                    sectionTitle.innerText = disciplineName;
                    container.appendChild(sectionTitle);

                    questionsOfDiscipline.forEach(q => {
                        // Salva o número de exibição para recuperar depois
                        q.displayNumber = globalQuestionIndex;
                        orderedAndShuffledQuestions.push(q);
                        
                        let shuffledOptions = shuffleArray([...q.options]);

                        let qDiv = document.createElement('div');
                        qDiv.className = 'question-card';
                        
                        let questionHTML = `
                            <h3>Questão ${globalQuestionIndex}</h3>
                            <p>${q.text}</p>
                            <ul class="options">
                        `;

                        shuffledOptions.forEach(opt => {
                            // Uso do escape para evitar quebrar o HTML caso haja aspas
                            let safeText = opt.text.replace(/"/g, '&quot;');
                            questionHTML += `
                                <li>
                                    <label>
                                        <input type="radio" name="q${globalQuestionIndex}" value="${opt.isCorrect}" required>
                                        ${opt.text}
                                    </label>
                                </li>
                            `;
                        });

                        questionHTML += `</ul>`;
                        qDiv.innerHTML = questionHTML;
                        container.appendChild(qDiv);
                        
                        globalQuestionIndex++;
                    });
                }
            });
        }

        function calculateResults() {
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            
            let answersCount = 0;
            for(let key of formData.keys()) {
                answersCount++;
            }

            if(answersCount < orderedAndShuffledQuestions.length) {
                alert("Por favor, responda a todas as questões antes de finalizar o simulado.");
                return;
            }

            let scores = {};
            disciplineOrder.forEach(d => {
                scores[d] = { correct: 0, total: 0 };
            });

            let totalCorrect = 0;
            let totalQuestions = orderedAndShuffledQuestions.length;
            
            // Oculta questionário
            form.style.display = 'none';
            document.querySelector('.header-info').style.display = 'none';
            
            const resultContainer = document.getElementById('result-container');
            const resultsList = document.getElementById('resultsList');
            const detailedFeedback = document.getElementById('detailedFeedback');
            
            let summaryHtml = `
                <div class="result-item total">
                    <span>Acertos Totais:</span>
                    <span>${totalCorrect} de ${totalQuestions} </span>
                </div>
                <h3>Resumo por Disciplina:</h3>
            `;
            
            let feedbackHtml = `<h3>Correção Detalhada das Questões:</h3>`;

            // Avalia e monta a estrutura detalhada por disciplina
            disciplineOrder.forEach(discipline => {
                let questionsOfDiscipline = orderedAndShuffledQuestions.filter(q => q.discipline === discipline);
                
                if(questionsOfDiscipline.length > 0) {
                    
                    feedbackHtml += `
                    <div class="feedback-section">
                        <div class="feedback-header">${discipline}</div>
                        <ul class="feedback-list">
                    `;

                    questionsOfDiscipline.forEach(q => {
                        let answerStr = formData.get(`q${q.displayNumber}`);
                        let isCorrect = answerStr === "true";
                        
                        scores[discipline].total += 1;
                        if(isCorrect) {
                            scores[discipline].correct += 1;
                            totalCorrect += 1;
                        }
                        
                        // Busca o texto da resposta correta
                        let correctAnswerText = q.options.find(o => o.isCorrect).text;
                        
                        // Retira caixas de texto do enunciado apenas para exibir o resumo limpo
                        let cleanText = q.text.replace(/<div class='text-box'>.*?<\/div><br>/g, '');
                        if(cleanText.length > 100) cleanText = cleanText.substring(0, 100) + '...';

                        let statusClass = isCorrect ? 'q-correct' : 'q-incorrect';
                        let statusText = isCorrect ? '✅ Você Acertou' : '❌ Você Errou';

                        feedbackHtml += `
                            <li class="${statusClass}">
                                <div class="q-title">Questão ${q.displayNumber} - ${statusText}</div>
                                <div class="q-answer">${cleanText}</div>
                                ${!isCorrect ? `<div class="q-correct-answer">A resposta correta era: ${correctAnswerText}</div>` : ''}
                            </li>
                        `;
                    });
                    
                    feedbackHtml += `</ul></div>`;
                }
            });

            // Atualiza a porcentagem final no resumo
            summaryHtml = `
                <div class="result-item total">
                    <span>Acertos Totais:</span>
                    <span>${totalCorrect} de ${totalQuestions} (${Math.round((totalCorrect/totalQuestions)*100)}%)</span>
                </div>
                <h3>Resumo por Disciplina:</h3>
            `;

            disciplineOrder.forEach(discipline => {
                let data = scores[discipline];
                if(data.total > 0) {
                    let percentage = Math.round((data.correct / data.total) * 100);
                    let color = percentage >= 60 ? 'green' : (percentage >= 40 ? 'orange' : 'red');
                    summaryHtml += `
                        <div class="result-item">
                            <span><strong>${discipline}</strong></span>
                            <span>
                                ${data.correct} / ${data.total} 
                                <span style="color:${color}; font-weight:bold; margin-left: 10px;">(${percentage}%)</span>
                            </span>
                        </div>
                    `;
                }
            });

            resultsList.innerHTML = summaryHtml;
            detailedFeedback.innerHTML = feedbackHtml;
            resultContainer.style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Garante que o script carrega perfeitamente após a publicação da página
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderQuiz);
        } else {
            renderQuiz();
        }
    </script>
</body>
